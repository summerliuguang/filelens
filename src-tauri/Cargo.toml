[package]
name = "filelens-desktop"
version = "0.1.0"
description = "FileLens desktop interface"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1"
filelens = { path = ".." }
image = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.4"
