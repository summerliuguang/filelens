[package]
name = "filelens-desktop"
version = "0.1.0"
description = "FileLens desktop interface"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
filelens = { path = ".." }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.10", features = [] }
