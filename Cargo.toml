[package]
name = "filelens"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local-first personal file duplicate finder"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
